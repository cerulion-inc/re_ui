[package]
edition = "2024"
rust-version = "1.92"
name = "re_ui"
version = "0.34.1"
authors = ["rerun.io <opensource@rerun.io>"]
build = "build.rs"
include = [
    "../../Cargo.lock",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "**/*.rs",
    "Cargo.toml",
    "data/*",
]
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rerun GUI theme and helpers, built around egui"
homepage = "https://rerun.io"
readme = "README.md"
license = "(MIT OR Apache-2.0) AND OFL-1.1"
repository = "https://github.com/rerun-io/rerun"
resolver = "2"

[package.metadata.docs.rs]
all-features = true

[features]
analytics = ["dep:re_analytics"]
default = []
testing = [
    "dep:egui_kittest",
    "re_analytics/testing",
]

[lib]
name = "re_ui"
path = "src/lib.rs"

[[example]]
name = "re_ui_example"
path = "examples/re_ui_example/main.rs"

[[test]]
name = "filter_widget_test"
path = "tests/filter_widget_test.rs"

[[test]]
name = "help_ui_test"
path = "tests/help_ui_test.rs"

[[test]]
name = "list_item_tests"
path = "tests/list_item_tests.rs"

[[test]]
name = "modal_tests"
path = "tests/modal_tests.rs"

[[test]]
name = "notification_test"
path = "tests/notification_test.rs"

